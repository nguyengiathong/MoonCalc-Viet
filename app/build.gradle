plugins {
    id 'com.android.application'
}

// Release signing key, if one is provided (CI writes it from GitHub secrets; see README).
// Without it the release APK is signed with the Android debug key, which still installs fine.
def keystorePath = System.getenv('MOONCALC_KEYSTORE')

// CI passes its run number so every published APK installs as an update over the previous one.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'io.github.nguyengiathong.mooncalc'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.nguyengiathong.mooncalc'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('MOONCALC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MOONCALC_KEY_ALIAS')
                keyPassword System.getenv('MOONCALC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "MoonCalc-Viet-${variant.versionName}.apk"
        }
    }
}
