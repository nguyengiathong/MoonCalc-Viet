name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without a release key the APK is signed with the debug key; keeping that key between runs
      # lets a newer APK install over an older one.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Load release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOONCALC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MOONCALC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from secrets."
          else
            echo "::notice::No MOONCALC_KEYSTORE_BASE64 secret; signing with the debug key."
          fi

      - name: Build release APK
        env:
          MOONCALC_KEYSTORE_PASSWORD: ${{ secrets.MOONCALC_KEYSTORE_PASSWORD }}
          MOONCALC_KEY_ALIAS: ${{ secrets.MOONCALC_KEY_ALIAS }}
          MOONCALC_KEY_PASSWORD: ${{ secrets.MOONCALC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
          {
            echo "### $(basename "$apk")"
            echo "Size: $(du -h "$apk" | cut -f1) · SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalc-Viet-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          apk=$(ls app/build/outputs/apk/release/*.apk)
          pre=""
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || pre="--prerelease"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" $pre \
              --title "MoonCalc Việt 1.0.${GITHUB_RUN_NUMBER}" \
              --notes "APK cho Android 7.0 trở lên, build từ nhánh \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Tải file .apk bên dưới về điện thoại và mở để cài đặt."
          fi

  # Installs the APK on an emulator and checks that the page actually renders (text computed by the
  # page's JavaScript shows up in the accessibility tree) without JavaScript errors.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: MoonCalc-Viet-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/smoke-test.sh apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
