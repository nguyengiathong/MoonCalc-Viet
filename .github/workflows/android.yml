name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Signing: the release key from secrets when configured (see README). Otherwise a key CI
      # generates once (random password, stored next to it) and keeps in the Actions cache, so a
      # newer APK still installs over an older one. GitHub drops a cache entry after 7 days without
      # builds, and a branch only sees its own and the default branch's entries; then a new key is
      # made and the app has to be reinstalled once.
      - name: Restore CI signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing
          key: mooncalc-ci-signing-key-v1

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOONCALC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOONCALC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOONCALC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOONCALC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            store="$RUNNER_TEMP/release.jks" storepw="$KEYSTORE_PASSWORD" keyalias="$KEY_ALIAS" keypw="$KEY_PASSWORD"
            echo "Signing with the release key from secrets."
          else
            if [ ! -f .ci-signing/ci.jks ]; then
              mkdir -p .ci-signing
              openssl rand -hex 24 > .ci-signing/password
              pw=$(cat .ci-signing/password)
              keytool -genkeypair -keystore .ci-signing/ci.jks -storetype PKCS12 -alias mooncalc \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass "$pw" -keypass "$pw" -dname "CN=MoonCalc Viet CI"
              echo "::warning::Generated a new CI signing key: uninstall builds signed with an older key before installing this one."
            fi
            store="$PWD/.ci-signing/ci.jks" storepw=$(cat .ci-signing/password) keyalias=mooncalc
            keypw="$storepw"
            echo "::add-mask::$storepw"
            echo "::notice::No MOONCALC_KEYSTORE_BASE64 secret; signing with the CI key from the Actions cache."
          fi
          {
            echo "MOONCALC_KEYSTORE=$store"
            echo "MOONCALC_KEYSTORE_PASSWORD=$storepw"
            echo "MOONCALC_KEY_ALIAS=$keyalias"
            echo "MOONCALC_KEY_PASSWORD=$keypw"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
          {
            echo "### $(basename "$apk")"
            echo "Size: $(du -h "$apk" | cut -f1) · SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "Signing certificate SHA-256: \`$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalc-Viet-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          apk=$(ls app/build/outputs/apk/release/*.apk)
          pre=""
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || pre="--prerelease"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" $pre \
              --title "MoonCalc Việt 1.0.${GITHUB_RUN_NUMBER}" \
              --notes "APK cho Android 7.0 trở lên, build từ nhánh \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Tải file .apk bên dưới về điện thoại và mở để cài đặt."
          fi

  # Installs the APK on an emulator and checks that the page actually renders (text computed by the
  # page's JavaScript shows up in the accessibility tree) without JavaScript errors.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: MoonCalc-Viet-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/smoke-test.sh apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
